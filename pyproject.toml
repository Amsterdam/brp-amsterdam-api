[project]
name = "brp-amsterdam-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography == 50.0.2",
    "Django == 5.2.19",
    "django-environ == 0.14.0",
    "django-cors-headers == 4.9.0",
    "django-csp == 4.0",
    "django-healthchecks == 1.6.0",
    # "amsterdam-schema-tools[django] == 6.0.1",
    "datapunt-authorization-django == 3.1.0",
    "djangorestframework == 3.18.3",
    "python-json-logger==4.2.0",
    "requests == 2.34.2",
    "requests-oauthlib == 2.0.0",
    # "sentry-sdk == 2.13.0",
    "more-ds == 0.0.6",
    "orjson == 3.13.0",
    "whitenoise == 6.12.0",
    "zeep==4.3.3",
    "uwsgi==2.0.31",

    # Monitoring
    "azure-monitor-ingestion == 1.1.0",
    "azure-monitor-opentelemetry == 1.8.12",
    "azure-identity == 1.27.0",
    "azure-keyvault == 4.2.0",
    "msal == 1.39.0",
    "uwsgitop == 0.12",
    "uwsgi-readiness-check == 0.2.0",

    # Testing
    "pytest == 9.2.0",
    "pytest-django == 4.14.0",
    "pytest-cov == 7.1.0",
    "python-owasp-zap-v2.4 == 0.1.0",
    "requests-mock == 1.12.1",
]

[dependency-groups]
dev = [
    # Packaging
    "pur == 7.4.0",

    # Linting
    "pre-commit==4.7.0",
    "ruff==0.17.4",

    # Testing
    "pytest-sugar==1.1.1",
    "termcolor==3.3.0",

    # Debugging
    "django-debug-toolbar==8.0.0",
    "django-extensions==4.1",
]

# ==== pytest ====
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
minversion = "6.0"
django_find_project = false
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--nomigrations",
    "--reuse-db",
    "--ds=tests.settings"
]
norecursedirs = ["node_modules", ".tox", ".git"]
filterwarnings = [
    "once::DeprecationWarning",
    "once::PendingDeprecationWarning",
    "ignore:Model '.*' was already registered. Reloading models is not advised.*:RuntimeWarning"
]

# ==== Coverage ====
[tool.coverage.run]
branch = true
source = ["gisserver"]
omit = ["*/migrations/*.py", "*/test*.py", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== ruff ====
[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "B", # flake8-bugbear
    "C90", # mccabe
    "BLE", # flake8-blind-except
    "C4", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "DJ", # flake8-django
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "PGH", # pygrep-hooks
    "RET", # flake8-return (partially)
    # "PT",  # flake8-pytest-style
    # "TCH",  # flake8-type-checking (moves import to `if typing.TYPE_CHECKING`)
    # "ERA",  # eradicate (commented out code)
    # "TRY",  # tryceratops
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "INT", # flake8-gettext
    "FLY", # flynt (fixes unneeded static string joins)
    "UP", # pyupgrade
    "S", # security (bugbear)
    "RUF010", # ruff: fix f"{str(..)}" usage
    "RUF013", # ruff: fix annotations for =None arguments
]
ignore = [
    "S311", # allow random.randint()
    "DJ001", # allow models.CharField(null=True)
    "SIM105", # enforcing contextlib.suppress() instead of try..catch
    "RET501", # unnecessary-return-none
    "RET505", # superfluous-else-return
    "RET505", # superfluous-else-return
    "RET506", # superfluous-else-raise
    "RET507", # superfluous-else-continue
    "RET508", # superfluous-else-break
    "S607", # subprocess partial path
]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-gettext]
extend-function-names = ["gettext_lazy", "ngettext_lazy", "pgettext", "pgettext_lazy", "npgettext", "npgettext_lazy"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.utils.timezone.make_aware".msg = "There is no need for make_aware(), pass tzinfo directly."

[tool.ruff.lint.isort]
known-first-party = ["dso_api", "rest_framework_dso", "tests"]
known-third-party = ["gisserver", "schematools"]
#required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]  # line too long
"docs/_ext/djangodummy/settings.py" = ["S105"]  # allow hardcoded SECRET_KEY
"src/tests/settings.py" = ["F405"]  # allow unknown variables via import from *
"src/tests/**/*.py" = ["DJ008", "S101", "S105", "S106", "S314", "S320", "S608"]  # allow asserts, hardcoded passwords, lxml parsing, SQL injection
